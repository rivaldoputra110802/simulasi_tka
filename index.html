            },
            {
                tipe: "Pilihan Ganda",
                wacana: `

                    <p style="margin-bottom: 10px; text-align: justify;">Gambar berikut ini memperlihatkan kenampakan bangun segi banyak tersebut</p>

                `,

                pilihan: [
                    "176 cm2",
                    "160 cm2",
                    "144 cm2",
                    "128 cm2"
                ],
                kunci: [1] 
            },
            {
                tipe: "Pilihan Ganda",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Gambar berikut menunjukkan sketsa bangun datar beserta ukurannya.</p>
                    <img src="soal20.png" style="width: 100%; max-width: 600px; border-radius: 8px; margin-bottom: 15px;">
                `,
                pertanyaan: "keliling bangun tersebut adalah ...",
                pilihan: [
                    "46 cm",
                    "50 cm",
                    "56 cm",
                    "60 cm"
                ],
                kunci: [3] 
            },
            {
                tipe: "Pilihan Ganda",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Jimmy merupakan anak yang sangat menyukai lukisan. Suatu hari, ia diajak orangtuanya untuk melihat pameran lukisan yang sedang diadakan di kotanya. Jimmy sangat tertarik pada suatu dinding yang terpajang 5 lukisan bertema binatang seperti pada gambar.</p>
                    <img src="soal22.png" style="width: 100%; max-width: 600px; border-radius: 8px; margin-bottom: 15px;">
                `,
                pertanyaan: "Jimmy ingin membeli lukisan untuk dipajang di rumahnya. Ia menyediakan tempat di kamarnya dengan luas 4.800 cm2. Lukisan manakah yang bisa dipajang Jimmi?",
                pilihan: [
                    "Lukisan A dan Lukisan B",
                    "Lukisan C dan Lukisan D",
                    "Lukisan E dan A",
                    "Lukisan B dan Lukisan D"
                ],
                kunci: [1] 
            },
            {
                tipe: "Benar Salah",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Desa makmur salah satu desa yang terkenal dengan pembuat kerajinan dari kain perca. Kain perca adalah kain sisa yang sudah tidak digunakan. Hal ini disebabkan di Desa Makmur terdapat industri konveksi (perusahaan pakaian). Kain-kain sisa produksi tersebut dimanfaatkan oleh warga Desa Makmur untuk membuat kerajinan. Salah satu produk yang dihasilkan adalah keset. keset buatan warga desa Makmur sudah terjual di berbagai daerah di Indonesia.</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Keset yang diproduksi terdapat tiga jenis. Berikut adalah bentuk, panjang, dan berat masing-masing jenis keset produksi Desa Makmur.</p>
                    <img src="soal24.png" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                    <p style="margin-bottom: 10px; text-align: justify;">keset-keset ini akan dikirim ke berbagai daerah di Indonesia. Keset dikemas dalam sebuah kardus. Di dalam satu kardus, ada dua jenis keset yang berbeda. banyak keset pada setiap kardus akan dimaksimalkan namun total berat tidak boleh melebihi 10 kg.</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Berapa banyak keset yang sebaiknya dimasukkan ke dalam kardus?</p>
                `   
                ,
                pertanyaan: "Pilih Benar atau Salah untuk setiap jumlah keset!",
                pilihan: [
                    "12 buah keset.",
                    "7 buah keset.",
                    "6 buah keset."
                ],
                kunci: ["0_B", "1_S", "2_S"]
            },
            {
                tipe: "Pilihan Ganda",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Desa makmur salah satu desa yang terkenal dengan pembuat kerajinan dari kain perca. Kain perca adalah kain sisa yang sudah tidak digunakan. Hal ini disebabkan di Desa Makmur terdapat industri konveksi (perusahaan pakaian). Kain-kain sisa produksi tersebut dimanfaatkan oleh warga Desa Makmur untuk membuat kerajinan. Salah satu produk yang dihasilkan adalah keset. keset buatan warga desa Makmur sudah terjual di berbagai daerah di Indonesia.</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Keset yang diproduksi terdapat tiga jenis. Berikut adalah bentuk, panjang, dan berat masing-masing jenis keset produksi Desa Makmur.</p>
                    <img src="soal24.png" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                    <p style="margin-bottom: 10px; text-align: justify;">Suatu hari, terdapat pesanan keset jenis 2 yang diberi hiasan pada setiap sudutnya. </p>
                `,
                pertanyaan: "Berapa banyak hiasan yang ada pada satu keset tersebut?",
                pilihan: [
                    "2 hiasan",
                    "4 hiasan",
                    "5 hiasan",
                    "6 hiasan"
                ],
                kunci: [1] 
            },
            {
                tipe: "Pilihan Ganda",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Pengusaha UMKM sedang merintis usaha roti. Ada dua cabang yang telah dibuka yakni cabang Jakarta dan Tangerang.</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Berikut ini data produksi roti dari dua cabang tersebut:</p>
                    <img src="grafik-roti-soal.jpg" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                    <p style="margin-bottom: 10px; text-align: justify;">Sumbu x menyatakan bulan produksi, sedangkan sumbu y menyatakan jumlah roti yang diproduksi.</p>
                `,
                pertanyaan: "Berdasarkan informasi yang diberikan, manakah gabungan produksi roti yang tepat dari dua cabang tersebut?",
                pilihan: [
                    "<img src='grafik-roti-a.jpg' style='max-width: 250px; border-radius: 6px;'>",
                    "<img src='grafik-roti-b.jpg' style='max-width: 250px; border-radius: 6px;'>",
                    "<img src='grafik-roti-c.jpg' style='max-width: 250px; border-radius: 6px;'>",
                    "<img src='grafik-roti-d.jpg' style='max-width: 250px; border-radius: 6px;'>"
                ],
                kunci: [3]
            },
            {
                tipe: "Ganda Kompleks",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Tahukah kamu apa itu <i>Screen Time</i>? <i>Screen Time</i> adalah waktu yang dihabiskan untuk menonton TV, menggunakan komputer atau laptop, bermain <i>game</i>, <i>handphone</i>, dan sejenisnya. <i>Screen Time</i> secara berlebihan memberikan dampak yang tidak baik, seperti mata minus atau rabun jauh.</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Oleh karena itu, Kementrian Kesehatan memberikan batas <i>Screen Time</i> anak. Batas <i>screen time</i> Siska yang berusia 16 tahun yaitu 2 jam pada hari sekolah dan 2,5 jam pada hari libur.</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Pemantauan lebih lanjut dilakukan oleh sekolah dengan meminta laporan <i>screen time</i> Siska setiap hari. Berikut laporan yang Siska berikan kepada sekolah.</p>
                    <img src="grafik-screentime.jpg" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                `,
                pertanyaan: "Siska sudah melewati batas <i>screen time</i> yang diperbolehkan. Ia disarankan untuk mengurangi <i>screen time</i> agar tidak timbul dampak yang buruk. Tentukanlah pengurangan waktu total <i>screen time</i> yang dapat dilakukan oleh Siska pada hari sekolah!<br><span style='font-size: 0.8em; color: #3b82f6; font-weight: normal;'>Pilih semua jawaban benar! Jawaban benar lebih dari satu.</span>",
                pilihan: [
                    "6 jam",
                    "5 jam",
                    "4 jam"
                ],
                kunci: [0, 1]
            },
            {
                tipe: "Pilihan Ganda",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Pak Fajar adalah pengurus kantin sekolah yang menjual beraneka macam makanan dan minuman. Pak Fajar selalu mendata jumlah menu yang terjual setiap hari. Berikut adalah penjualan di kantin untuk hari ini (Kamis).</p>
                    <img src="grafik-kantin.png" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                `,
                pertanyaan: "Berapa banyak murid yang membeli telur gulung?",
                pilihan: [
                    "22",
                    "23",
                    "24",
                    "25"
                ],
                kunci: [1]
            },
            {
                tipe: "Benar Salah",
                wacana: `
                    <p style="margin-bottom: 10px; text-align: justify;">Tahukah kalian, ternyata panas bumi yang dihasilkan oleh gunung berapi bisa menjadi pembangkit listrik, loh. Penelitian menunjukkan bahwa beberapa gunung berapi bisa menghasilkan daya listrik sebesar 1.000 Megawatt (Mw). Wow, banyak sekali kan!</p>
                    <p style="margin-bottom: 10px; text-align: justify;">Padahal 50 Mw saja sudah cukup untuk 50.000 rumah. Indonesia sebenarnya bisa menjadi pemimpin dunia di bidang ini, karena banyak gunung berapi yang masih aktif. Indonesia bisa memanfaatkan panasnya magma dan uap yang keluar sebagai sumber penghasil listrik. Berikut ini adalah data gunung berapi yang masih aktif di beberapa negara dari tahun 1960 sampai tahun 2023.</p>
                    <img src="grafik-gunung.jpg" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                    <div style="background-color: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
                        <p style="margin-bottom: 0; color: #334155; text-align: justify;">Peneliti mengatakan bahwa dengan jumlah gunung berapi yang ada di Tonga, negara tersebut dapat menghasilkan paling sedikit <strong>450 Mw listrik</strong>. Bila setiap gunung api aktif diasumsikan dapat menghasilkan setidaknya energi listrik yang sama, maka berapakah besar energi listrik yang dihasilkan oleh negara lainnya?</p>
                    </div>
                `,
                pertanyaan: "Tentukan Benar atau Salah untuk setiap pernyataan berikut ini!",
                pilihan: [
                    "Gunung berapi di Rusia dapat menghasilkan paling sedikit 1.350 Mw listrik.",
                    "Gunung berapi di Vanuatu dapat menghasilkan paling sedikit 450 Mw listrik.",
                    "Gunung berapi di Papua Nugini dapat menghasilkan paling sedikit 550 Mw listrik."
                ],
                kunci: ["0_B", "1_B", "2_S"]
            },
            {
                tipe: "Pilihan Ganda",
                wacana: `
                    <p style="margin-bottom: 10px; font-weight: bold; text-align: center;">Karya Wisata</p>
                    <p style="margin-bottom: 10px; text-align: justify;">SD Pelita mengadakan kegiatan karya wisata ke Monumen Nasional (Monas). Siswa akan berangkat dari sekolah menuju ke Monas menggunakan bus. Pak Amir sebagai guru mendata jumlah siswa kelas 6 yang mengikuti kegiatan karya wisata tersebut. Berikut data yang didapatkan Pak Amir.</p>
                    <img src="grafik-karyawisata.png" style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;">
                `,
                pertanyaan: "Seluruh siswa kelas 6 akan menempati 1 bus yang dapat menampung paling banyak 72 orang siswa. Diketahui tidak ada kursi tersisa di bus tersebut. Berapa banyak siswa kelas 6C yang mengikuti kegiatan karya wisata?",
                pilihan: [
                    "22 siswa.",
                    "23 siswa.",
                    "24 siswa.",
                    "25 siswa."
                ],
                kunci: [1]
            }
            
        ];
        // ==========================================

        let timerSiswa = null;
        let currentIndex = 0;
        let jawabanSiswa = []; 
        let ujianSelesai = false; 
        let namaSiswaAktif = ""; 

        // AUTO-LOGIN JIKA SEBELUMNYA REFRESH HALAMAN
        window.onload = function() {
            if (localStorage.getItem('nama_siswa_ahe')) {
                const savedIndex = localStorage.getItem('index_soal_ahe');
                if (savedIndex) currentIndex = parseInt(savedIndex);
                masukSiswa(true);
            }
        };

        // FUNGSI UTAMA SISWA
        function masukSiswa(isAuto = false) {
            if (!isAuto) {
                namaSiswaAktif = document.getElementById('nama-siswa').value.trim();
                if(!namaSiswaAktif) { alert("Isi nama dulu ya!"); return; }
                localStorage.setItem('nama_siswa_ahe', namaSiswaAktif); 
                currentIndex = 0;
            } else {
                namaSiswaAktif = localStorage.getItem('nama_siswa_ahe');
            }

            const savedJawaban = localStorage.getItem('jawaban_ahe_' + namaSiswaAktif);
            if (savedJawaban) {
                jawabanSiswa = JSON.parse(savedJawaban);
            } else {
                jawabanSiswa = Array.from({length: paketSoalTKA.length}, () => []);
            }
            
            ujianSelesai = false;
            
            // SEMBUNYIKAN LOGIN, TAMPILKAN AREA UJIAN
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('siswa-page').classList.remove('hidden');
            document.getElementById('area-ujian').classList.remove('hidden');
            document.getElementById('area-selesai').classList.add('hidden');
            
            renderSoal(currentIndex);
            
            // SET DURASI UJIAN (120 Menit / 2 Jam)
            if(!timerSiswa) { mulaiTimerLokal(120); }
        }

        function mulaiTimerLokal(menit) {
            let endTimeSiswa = localStorage.getItem('endtime_ahe_' + namaSiswaAktif);
            
            if (!endTimeSiswa) {
                // Konversi 120 menit ke milidetik = 120 * 60 * 1000
                endTimeSiswa = Date.now() + (menit * 60 * 1000);
                localStorage.setItem('endtime_ahe_' + namaSiswaAktif, endTimeSiswa);
            } else {
                endTimeSiswa = parseInt(endTimeSiswa);
            }

            const timerElemen = document.getElementById('timer-display');

            timerSiswa = setInterval(() => {
                const sisa = endTimeSiswa - Date.now();
                if(sisa <= 0) {
                    // WAKTU HABIS
                    clearInterval(timerSiswa);
                    timerElemen.innerText = "00:00:00";
                    if(!ujianSelesai) {
                        simpanJawabanSaatIni();
                        koreksiOtomatis();
                    }
                } else {
                    // Konversi milidetik ke jam, menit, detik
                    const totalDetik = Math.floor(sisa / 1000);
                    const jam = Math.floor(totalDetik / 3600);
                    const mnt = Math.floor((totalDetik % 3600) / 60);
                    const dtk = totalDetik % 60;
                    
                    let formatWaktu = `${jam.toString().padStart(2, '0')}:${mnt.toString().padStart(2, '0')}:${dtk.toString().padStart(2, '0')}`;
                    timerElemen.innerText = formatWaktu;

                    // Beri warna merah jika sisa waktu <= 3 menit (180 detik)
                    if(totalDetik <= 180) {
                        timerElemen.classList.add('waktu-habis');
                    } else {
                        timerElemen.classList.remove('waktu-habis');
                    }
                }
            }, 1000);
        }

        function navigasi(arah) { 
            simpanJawabanSaatIni(); 
            currentIndex += arah; 
            renderSoal(currentIndex); 
        }

        function simpanJawabanSaatIni() {
            const container = document.getElementById('wadah-pilihan');
            const inputs = container.querySelectorAll('input:checked');
            
            jawabanSiswa[currentIndex] = Array.from(inputs).map(el => {
                return el.value.includes('_') ? el.value : parseInt(el.value);
            });
            
            if(namaSiswaAktif) {
                localStorage.setItem('jawaban_ahe_' + namaSiswaAktif, JSON.stringify(jawabanSiswa));
                localStorage.setItem('index_soal_ahe', currentIndex);
            }
        }

        function renderSoal(indeks) {
            const s = paketSoalTKA[indeks];
            document.getElementById('nomor-soal-display').innerText = `Soal ${indeks + 1}/${paketSoalTKA.length}`;
            const wadahWacana = document.getElementById('konten-wacana');
            
            if(s.wacana) { 
                wadahWacana.style.display = "block"; 
                wadahWacana.innerHTML = s.wacana; 
            } else { 
                wadahWacana.style.display = "none"; 
            }
            
            document.getElementById('konten-pertanyaan').innerHTML = s.pertanyaan;
            const containerPilihan = document.getElementById('wadah-pilihan');
            containerPilihan.innerHTML = '';
            
            const savedAns = jawabanSiswa[indeks] || []; 

            if (s.tipe === 'Benar Salah') {
                let htmlTable = `
                    <div class="overflow-hidden border border-blue-300 rounded-xl mb-2 shadow-sm">
                    <table class="w-full text-sm text-left" style="border:none;">
                        <thead class="bg-blue-100 text-blue-900 font-bold" style="border-bottom: 2px solid #93c5fd;">
                            <tr>
                                <th class="p-3" style="border:none;">Pernyataan</th>
                                <th class="p-3 text-center w-16" style="border:none;">Benar</th>
                                <th class="p-3 text-center w-16" style="border:none;">Salah</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white">
                `;
                s.pilihan.forEach((pil, i) => {
                    const valB = i + "_B";
                    const valS = i + "_S";
                    const isCheckedB = savedAns.includes(valB) ? "checked" : "";
                    const isCheckedS = savedAns.includes(valS) ? "checked" : "";
                    
                    htmlTable += `
                        <tr class="hover:bg-blue-50 transition" style="border-bottom: 1px solid #e5e7eb;">
                            <td class="p-3 text-gray-700 leading-snug" style="border:none;">${pil}</td>
                            <td class="p-3 text-center align-middle" style="border:none; border-left: 1px solid #e5e7eb;">
                                <input type="radio" name="bs_${i}" value="${valB}" ${isCheckedB} onchange="simpanJawabanSaatIni()" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </td>
                            <td class="p-3 text-center align-middle" style="border:none; border-left: 1px solid #e5e7eb;">
                                <input type="radio" name="bs_${i}" value="${valS}" ${isCheckedS} onchange="simpanJawabanSaatIni()" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </td>
                        </tr>
                    `;
                });
                htmlTable += `</tbody></table></div>`;
                containerPilihan.innerHTML = htmlTable;
            } 
            else {
                const type = s.tipe === 'Ganda Kompleks' ? 'checkbox' : 'radio';
                s.pilihan.forEach((pil, i) => {
                    const isChecked = savedAns.includes(i) ? "checked" : "";
                    containerPilihan.innerHTML += `
                        <label class="flex items-center gap-3 p-3 bg-white border border-gray-300 rounded-lg mb-2 cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition shadow-sm">
                            <input type="${type}" name="jawaban" value="${i}" ${isChecked} onchange="simpanJawabanSaatIni()" class="w-5 h-5 text-blue-600">
                            <span class="text-gray-800 font-medium text-sm md:text-base leading-snug w-full">${pil}</span>
                        </label>
                    `;
                });
            }

            document.getElementById('btn-prev').style.display = indeks === 0 ? 'none' : 'block';
            if (indeks === paketSoalTKA.length - 1) {
                document.getElementById('btn-next').style.display = 'none';
                document.getElementById('btn-selesai').style.display = 'block';
            } else {
                document.getElementById('btn-next').style.display = 'block';
                document.getElementById('btn-selesai').style.display = 'none';
            }
        }

        function kumpulkanMandiri() {
            if(confirm("Yakin mau dikumpul sekarang?")) {
                simpanJawabanSaatIni();
                koreksiOtomatis();
            }
        }

        function koreksiOtomatis() {
            ujianSelesai = true;
            clearInterval(timerSiswa);
            document.getElementById('area-ujian').classList.add('hidden');
            document.getElementById('area-selesai').classList.remove('hidden');

            let benar = 0;
            const total = paketSoalTKA.length;

            paketSoalTKA.forEach((soal, i) => {
                const jawab = jawabanSiswa[i] || [];
                const kunci = soal.kunci || [];

                if (jawab.length === kunci.length && kunci.every(val => jawab.includes(val))) {
                    benar++;
                }
            });

            const nilaiAkhir = Math.round((benar / total) * 100);
            document.getElementById('skor-angka').innerText = nilaiAkhir;
            document.getElementById('detail-skor').innerText = `Benar ${benar} dari ${total} soal`;
            
            // Hapus cache agar siswa tidak otomatis masuk jika me-refresh halaman nilai
            localStorage.removeItem('nama_siswa_ahe');
            localStorage.removeItem('jawaban_ahe_' + namaSiswaAktif);
            localStorage.removeItem('index_soal_ahe');
            localStorage.removeItem('endtime_ahe_' + namaSiswaAktif);
        }

        function keluarKeAwal() {
            location.reload();
        }
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
    <!-- HALAMAN AWAL (LOGIN) -->
    <div id="login-page" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="bg-white p-6 rounded-3xl shadow-lg w-full max-w-sm text-center border-t-8 border-blue-500">
            <h1 class="text-2xl font-black text-blue-600 mb-1">CBT AKM</h1>
            <p class="text-gray-500 mb-6 text-xs font-bold">LES AHE</p>
            <input type="text" id="nama-siswa" placeholder="Ketik nama panggilanmu" class="w-full p-3 bg-gray-100 border-2 border-transparent rounded-xl focus:bg-white focus:border-blue-500 font-bold text-center text-lg mb-4 outline-none">
            <button onclick="masukSiswa()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-xl text-lg shadow-[0_4px_0_0_#1d4ed8]">MASUK UJIAN</button>
        </div>
    </div>

    <!-- HALAMAN SISWA -->
    <div id="siswa-page" class="hidden max-w-2xl mx-auto p-2 md:p-4">

        <!-- RUANG UJIAN COMPACT -->
        <div id="area-ujian" class="hidden">
            <div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center mb-3 sticky top-2 z-10 border-b-2 border-blue-500">
                <span id="nomor-soal-display" class="font-bold text-gray-700 bg-gray-100 px-3 py-1 rounded-md text-sm">Soal 1</span>
                <div class="flex items-center gap-1 text-red-600 bg-red-50 px-3 py-1 rounded-md border border-red-200">
                    <span id="timer-display" class="text-lg font-black tabular-nums">02:00:00</span>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm mb-3 konten-soal">
                <div id="konten-wacana" class="mb-3 text-gray-800 text-sm md:text-base leading-relaxed max-h-[35vh] overflow-y-auto bg-amber-50 p-3 rounded-lg border border-amber-200 shadow-inner scroll-wacana hidden"></div>
                <h3 id="konten-pertanyaan" class="text-base md:text-lg font-bold text-gray-900 mb-4 leading-snug"></h3>
                <div id="wadah-pilihan" class="flex flex-col"></div>
            </div>
            
            <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm">
                <button id="btn-prev" onclick="navigasi(-1)" class="bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg text-sm hidden">Kembali</button>
                <div class="flex-1"></div> 
                <button id="btn-next" onclick="navigasi(1)" class="bg-blue-500 text-white font-bold py-2 px-6 rounded-lg text-sm shadow-[0_4px_0_0_#1d4ed8]">Lanjut</button>
                <button id="btn-selesai" onclick="kumpulkanMandiri()" class="bg-green-500 text-white font-bold py-2 px-6 rounded-lg text-sm shadow-[0_4px_0_0_#15803d] hidden">Kumpul</button>
            </div>
        </div>

        <!-- RUANG SELESAI -->
        <div id="area-selesai" class="hidden flex flex-col items-center justify-center py-8 text-center">
            <div class="bg-white p-8 rounded-3xl shadow-lg w-full border-t-8 border-green-500 mb-4">
                <div class="text-5xl mb-3">SELAMAT!</div>
                <h2 class="text-xl font-black text-gray-800 mb-1">Ujian Selesai</h2>
                <p class="text-gray-500 mb-5 text-sm">Jawabanmu sudah berhasil dikoreksi sistem.</p>
                <div class="bg-blue-50 rounded-2xl p-5 border-2 border-blue-100">
                    <p class="text-xs font-bold text-gray-500 mb-1">NILAI AKHIR KAMU</p>
                    <p id="skor-angka" class="text-6xl font-black text-blue-600 mb-1">0</p>
                    <p id="detail-skor" class="text-gray-600 font-medium bg-white inline-block px-3 py-1 rounded-md shadow-sm text-sm">Benar 0 dari 0 soal</p>
                </div>
                <button onclick="keluarKeAwal()" class="mt-6 bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-lg text-sm">Kembali ke Awal</button>
            </div>
        </div>
    </div>
</body>
</html>
