<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi CBT TKA - Ahe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .konten-soal table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .konten-soal table, .konten-soal th, .konten-soal td { border: 1px solid #4b5563; padding: 8px; text-align: left; }
        .konten-soal img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 1rem; }
        input[type="radio"], input[type="checkbox"] { transform: scale(1.5); accent-color: #2563eb; cursor: pointer; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <script>
        // KODE FIREBASE ALDO
        const firebaseConfig = {
            apiKey: "AIzaSyCoC3kabcXL-C9U_jhgLdcAmRcnqfVP4AQ",
            authDomain: "simulasitka-62b3f.firebaseapp.com",
            databaseURL: "https://simulasitka-62b3f-default-rtdb.firebaseio.com", 
            projectId: "simulasitka-62b3f",
            storageBucket: "simulasitka-62b3f.firebasestorage.app",
            messagingSenderId: "1070761016017",
            appId: "1:1070761016017:web:753a59214586d581c6a3f0",
            measurementId: "G-54558PFC3R"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // SOAL UJIAN (Tanpa Pembahasan)
        const paketSoalTKA = [
            {
                tipe: "Ganda Kompleks",
                wacana: `
                    <p style="margin-bottom: 10px; font-weight: 500;">Bangun datar berikut merupakan potongan yang terlihat mewakili bagian dari suatu objek utuh.</p>
                    <img src="potongan.jpg" style="max-width: 120px; margin-bottom: 20px;">
                `,
                pertanyaan: "Manakah dari gambar berikut ini yang merupakan gambar objek utuh tersebut?<br><span style='font-size: 0.85em; color: #3b82f6; font-weight: normal;'>Centang gambar yang BENAR (Jawaban bisa lebih dari satu). Gambar yang salah biarkan kosong.</span>",
                pilihan: [
                    "<img src='opsi1.jpg' style='max-width: 250px; border-radius: 8px;'>",
                    "<img src='opsi2.jpg' style='max-width: 250px; border-radius: 8px;'>",
                    "<img src='opsi3.jpg' style='max-width: 250px; border-radius: 8px;'>"
                ],
                kunci: [0, 2] 
            }
        ];
        // ==========================================

        let timerSiswa = null;
        let currentIndex = 0;
        let jawabanSiswa = []; 
        let ujianSelesai = false; 
        let namaSiswaAktif = ""; 

        // AUTO-LOGIN SAAT HALAMAN DI-REFRESH
        window.onload = function() {
            if (localStorage.getItem('is_guru_ahe') === 'true') {
                masukGuru(true);
            } else if (localStorage.getItem('nama_siswa_ahe')) {
                const savedIndex = localStorage.getItem('index_soal_ahe');
                if (savedIndex) currentIndex = parseInt(savedIndex);
                masukSiswa(true);
            }
        };

        // FUNGSI GURU
        function masukGuru(isAuto = false) {
            if (!isAuto) {
                let pin = prompt("Masukkan PIN Rahasia Guru :");
                if(pin !== "ALDO123") { alert("PIN Salah!"); return; }
                localStorage.setItem('is_guru_ahe', 'true'); 
            }

            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('guru-page').classList.remove('hidden');
            document.getElementById('jml-soal-info').innerText = paketSoalTKA.length;

            db.ref('tka_live/hasil').on('value', (snapshot) => {
                const data = snapshot.val();
                const tabel = document.getElementById('tabel-hasil-siswa');
                if(!data) {
                    tabel.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-400 italic">Belum ada nilai yang masuk.</td></tr>';
                    return;
                }
                
                tabel.innerHTML = '';
                for (const nama in data) {
                    tabel.innerHTML += `
                        <tr class="border-b">
                            <td class="p-3 text-gray-800 font-bold">${nama}</td>
                            <td class="p-3 text-center text-gray-600">${data[nama].benar} / ${paketSoalTKA.length}</td>
                            <td class="p-3 text-center font-black text-blue-600 text-lg">${data[nama].nilai}</td>
                        </tr>
                    `;
                }
            });
        }

        function keluarGuru() {
            localStorage.removeItem('is_guru_ahe');
            window.location.reload();
        }

        function resetDatabase() {
            if(confirm("Yakin ingin mereset ujian? Semua nilai anak dan status ujian sebelumnya akan dihapus permanen!")) {
                db.ref('tka_live').set(null).then(() => {
                    alert("Database berhasil dibersihkan! Ujian kembali ke status 'Menunggu'.");
                    window.location.reload(); 
                });
            }
        }

        function mulaiUjianSekarang() {
            const menit = parseInt(document.getElementById('durasi-ujian').value) || 60;
            const endTime = Date.now() + (menit * 60 * 1000);
            db.ref('tka_live/hasil').set(null); 
            db.ref('tka_live/state').set({ status: 'jalan', endTime: endTime, totalSoal: paketSoalTKA.length });
            document.getElementById('status-guru-live').innerText = "UJIAN SEDANG BERLANGSUNG! (" + menit + " Menit)";
            document.getElementById('status-guru-live').className = "font-bold p-2 rounded-lg mb-6 text-center bg-green-100 text-green-700";
        }

        function hentikanUjian() {
            if(confirm("Tarik paksa ujian sekarang? Layar anak-anak akan langsung dikoreksi otomatis.")) {
                db.ref('tka_live/state').set({ status: 'selesai' });
                document.getElementById('status-guru-live').innerText = "UJIAN DITUTUP PAKSA.";
                document.getElementById('status-guru-live').className = "font-bold p-2 rounded-lg mb-6 text-center bg-red-100 text-red-700";
            }
        }

        // FUNGSI SISWA (ANTI-REFRESH)
        function masukSiswa(isAuto = false) {
            if (!isAuto) {
                namaSiswaAktif = document.getElementById('nama-siswa').value.trim();
                if(!namaSiswaAktif) { alert("Isi nama dulu ya!"); return; }
                localStorage.setItem('nama_siswa_ahe', namaSiswaAktif); 
                currentIndex = 0;
            } else {
                namaSiswaAktif = localStorage.getItem('nama_siswa_ahe');
            }

            const savedJawaban = localStorage.getItem('jawaban_ahe_' + namaSiswaAktif);
            if (savedJawaban) {
                jawabanSiswa = JSON.parse(savedJawaban);
            } else {
                jawabanSiswa = new Array(paketSoalTKA.length).fill([]);
            }

            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('siswa-page').classList.remove('hidden');
            
            db.ref('tka_live/state').on('value', (snapshot) => {
                const data = snapshot.val();
                
                if(!data || data.status === 'menunggu') {
                    localStorage.removeItem('nama_siswa_ahe');
                    localStorage.removeItem('jawaban_ahe_' + namaSiswaAktif);
                    localStorage.removeItem('index_soal_ahe');
                    
                    document.getElementById('area-tunggu').classList.remove('hidden');
                    document.getElementById('area-ujian').classList.add('hidden');
                    document.getElementById('area-selesai').classList.add('hidden');
                    
                    document.getElementById('login-page').classList.remove('hidden');
                    document.getElementById('siswa-page').classList.add('hidden');
                    document.getElementById('nama-siswa').value = "";
                    return;
                }

                if(data.status === 'jalan' && !ujianSelesai) {
                    document.getElementById('area-tunggu').classList.add('hidden');
                    document.getElementById('area-ujian').classList.remove('hidden');
                    if(!timerSiswa) {
                        mulaiTimerGlobal(data.endTime);
                        renderSoal(currentIndex);
                    }
                } else if (data.status === 'selesai' && !ujianSelesai) {
                    koreksiOtomatis();
                }
            });
        }

        function mulaiTimerGlobal(endTime) {
            timerSiswa = setInterval(() => {
                const sisa = endTime - Date.now();
                if(sisa <= 0) {
                    clearInterval(timerSiswa);
                } else {
                    const m = Math.floor(sisa / 60000);
                    const d = Math.floor((sisa % 60000) / 1000);
                    document.getElementById('timer-display').innerText = `${m}:${d < 10 ? '0' : ''}${d}`;
                }
            }, 1000);
        }

        // FUNGSI NAVIGASI
        function navigasi(arah) { 
            simpanJawabanSaatIni(); 
            currentIndex += arah; 
            renderSoal(currentIndex); 
        }

        function simpanJawabanSaatIni() {
            const inputs = document.querySelectorAll('input[name="jawaban"]:checked');
            jawabanSiswa[currentIndex] = Array.from(inputs).map(el => parseInt(el.value));
            
            if(namaSiswaAktif) {
                localStorage.setItem('jawaban_ahe_' + namaSiswaAktif, JSON.stringify(jawabanSiswa));
                localStorage.setItem('index_soal_ahe', currentIndex);
            }
        }

        function renderSoal(indeks) {
            const s = paketSoalTKA[indeks];
            document.getElementById('nomor-soal-display').innerText = `Soal ${indeks + 1} dari ${paketSoalTKA.length}`;
            const wadahWacana = document.getElementById('konten-wacana');
            
            if(s.wacana) { wadahWacana.style.display = "block"; wadahWacana.innerHTML = s.wacana; } 
            else { wadahWacana.style.display = "none"; }
            
            document.getElementById('konten-pertanyaan').innerHTML = s.pertanyaan;
            const containerPilihan = document.getElementById('wadah-pilihan');
            containerPilihan.innerHTML = '';
            
            const type = s.tipe === 'Ganda Kompleks' ? 'checkbox' : 'radio';
            const savedAns = jawabanSiswa[indeks] || []; 

            s.pilihan.forEach((pil, i) => {
                const isChecked = savedAns.includes(i) ? "checked" : "";
                containerPilihan.innerHTML += `
                    <label class="flex items-start gap-4 p-4 bg-white border-2 border-gray-200 rounded-xl mb-3 cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition">
                        <input type="${type}" name="jawaban" value="${i}" ${isChecked} onchange="simpanJawabanSaatIni()" class="w-6 h-6 mt-1 text-blue-600">
                        <span class="text-gray-700 font-medium text-lg">${pil}</span>
                    </label>
                `;
            });

            // LOGIKA MUNCUL/HILANG TOMBOL "SEBELUMNYA"
            document.getElementById('btn-prev').style.display = indeks === 0 ? 'none' : 'block';
            
            // LOGIKA MUNCUL/HILANG TOMBOL "SELANJUTNYA" VS "SELESAI"
            if (indeks === paketSoalTKA.length - 1) {
                document.getElementById('btn-next').style.display = 'none';
                document.getElementById('btn-selesai').style.display = 'block';
            } else {
                document.getElementById('btn-next').style.display = 'block';
                document.getElementById('btn-selesai').style.display = 'none';
            }
        }

        function kumpulkanMandiri() {
            if(confirm("Yakin ingin mengumpulkan jawaban sekarang? Kamu tidak bisa mengulang!")) {
                simpanJawabanSaatIni();
                koreksiOtomatis();
            }
        }

        function koreksiOtomatis() {
            ujianSelesai = true;
            clearInterval(timerSiswa);
            document.getElementById('area-ujian').classList.add('hidden');
            document.getElementById('area-tunggu').classList.add('hidden');
            document.getElementById('area-selesai').classList.remove('hidden');

            let benar = 0;
            const total = paketSoalTKA.length;

            paketSoalTKA.forEach((soal, i) => {
                const jawab = jawabanSiswa[i] || [];
                const kunci = soal.kunci || [];

                if (jawab.length === kunci.length && kunci.every(val => jawab.includes(val))) {
                    benar++;
                }
            });

            const nilaiAkhir = Math.round((benar / total) * 100);
            document.getElementById('skor-angka').innerText = nilaiAkhir;
            document.getElementById('detail-skor').innerText = `Benar ${benar} dari ${total} soal`;

            db.ref('tka_live/hasil/' + namaSiswaAktif).set({ nilai: nilaiAkhir, benar: benar });
        }
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
    <!-- HALAMAN AWAL (LOGIN) -->
    <div id="login-page" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center border-t-8 border-blue-500">
            <h1 class="text-3xl font-black text-blue-600 mb-2">Simulasi AKM CBT</h1>
            <p class="text-gray-500 mb-8 text-sm font-bold">LES AHE</p>
            <input type="text" id="nama-siswa" placeholder="Ketik namamu di sini" class="w-full p-4 bg-gray-100 border-2 border-transparent rounded-xl focus:bg-white focus:border-blue-500 font-bold text-center text-xl mb-6 outline-none">
            <button onclick="masukSiswa()" class="w-full bg-blue-500 text-white font-bold py-4 rounded-xl text-xl mb-6 shadow-[0_4px_0_0_#1d4ed8]">MASUK UJIAN</button>
            <button onclick="masukGuru()" class="text-xs text-gray-400 hover:text-gray-600 underline">Masuk sebagai Guru</button>
        </div>
    </div>

    <!-- HALAMAN GURU -->
    <div id="guru-page" class="hidden p-4 max-w-xl mx-auto mt-6">
        <div class="bg-white p-6 rounded-2xl shadow-xl border-t-8 border-purple-500">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-2xl font-black text-purple-700">Pusat Kendali Guru</h2>
                <div class="flex gap-2">
                    <button onclick="keluarGuru()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-2 px-3 rounded shadow">Logout</button>
                    <button onclick="resetDatabase()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 px-3 rounded shadow">
